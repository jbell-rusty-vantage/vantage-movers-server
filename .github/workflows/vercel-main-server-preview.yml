name: Vercel Preview

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: vercel-preview-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_MAIN_SERVER }}
  VERCEL_GIT_PROVIDER: github
  VERCEL_GIT_REPO_SLUG: ${{ github.event.repository.name }}
  VERCEL_GIT_REPO_OWNER: ${{ github.repository_owner }}
  VERCEL_GIT_COMMIT_REF: ${{ github.head_ref || github.ref_name }}
  VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
  VERCEL_GIT_COMMIT_AUTHOR_LOGIN: ${{ github.actor }}
  VERCEL_GIT_PULL_REQUEST_ID: ${{ github.event.pull_request.number || '' }}
  VANTAGE_API_SECRET: ${{ secrets.VANTAGE_API_SECRET }}

jobs:
  deploy:
    name: Build and deploy preview
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.13.1

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Pull Vercel preview environment
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build prebuilt output
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt preview
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --archive=tgz --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Preview deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"

name: Vercel Preview

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: vercel-preview-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_MAIN_SERVER }}
  VERCEL_GIT_PROVIDER: github
  VERCEL_GIT_REPO_SLUG: ${{ github.event.repository.name }}
  VERCEL_GIT_REPO_OWNER: ${{ github.repository_owner }}
  VERCEL_GIT_COMMIT_REF: ${{ github.head_ref || github.ref_name }}
  VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
  VERCEL_GIT_COMMIT_AUTHOR_LOGIN: ${{ github.actor }}
  VERCEL_GIT_PULL_REQUEST_ID: ${{ github.event.pull_request.number || '' }}
  VANTAGE_API_SECRET: ${{ secrets.VANTAGE_API_SECRET }}

jobs:
  deploy:
    name: Build and deploy preview
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.13.1

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Show Vercel CLI version
        run: pnpm exec vercel --version

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Pull Vercel preview environment
        run: pnpm exec vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build prebuilt output
        run: pnpm exec vercel build --token="$VERCEL_TOKEN"

      - name: Summarize prebuilt output
        run: |
          echo "### Prebuilt output" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          node <<'NODE' | tee -a "$GITHUB_STEP_SUMMARY"
          const fs = require("node:fs");
          const path = require("node:path");

          let files = 0;
          let bytes = 0;

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const fullPath = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                walk(fullPath);
                continue;
              }
              if (entry.isFile()) {
                files += 1;
                bytes += fs.statSync(fullPath).size;
              }
            }
          }

          walk(".vercel/output");
          console.log(`files: ${files}`);
          console.log(`size: ${(bytes / 1024 / 1024).toFixed(1)} MB`);
          NODE
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy prebuilt preview
        id: deploy
        run: |
          url="$(pnpm exec vercel deploy --prebuilt --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Preview deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
